name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  GODOT_VERSION: 4.5.1

jobs:
  test-python:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Run Python tests
        run: |
          cd tests
          python test_python_parser.py

  test-godot:
    name: Tests Godot (GUT)
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      # Launch a first time to load all class
      - name: Import Godot project
        run: |
          godot --headless --import --quit
        timeout-minutes: 2

      - name: Run GUT tests
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/ -gexit 2>&1 | tee gut_output.log

      - name: Check for GUT errors
        run: |
          # Vérifier les erreurs critiques GUT
          if grep -q "Some GUT class_names have not been imported" gut_output.log; then
            echo "❌ ERREUR: Les classes GUT n'ont pas été importées!"
            echo "Ce problème devrait être résolu en ajoutant une étape d'import avant les tests."
            exit 1
          fi
          
          # Extraire les statistiques de tests GUT
          if grep -q "Passing Tests" gut_output.log; then
            PASSED=$(grep "Passing Tests" gut_output.log | grep -oP '\d+')
            TOTAL=$(grep "^Tests " gut_output.log | grep -oP '\d+')
            
            echo "📊 Résultats GUT : $PASSED/$TOTAL tests passés"
            
            if [ "$PASSED" -eq 0 ]; then
              echo "❌ Aucun test n'a réussi!"
              exit 1
            fi
            
            # Vérifier si des tests ont échoué (hors risky/pending)
            # Note: Risky = test sans assertion, Pending = test marqué comme non implémenté
            # Ces tests ne comptent PAS comme des échecs, ce sont des avertissements
            RISKY=$(grep "Risky/Pending" gut_output.log | grep -oP '\d+' || echo "0")
            FAILED=$((TOTAL - PASSED - RISKY))
            
            if [ "$FAILED" -gt 0 ]; then
              echo "❌ $FAILED test(s) ont échoué (hors risky/pending)"
              exit 1
            fi
          else
            echo "❌ Impossible de parser les résultats GUT"
            cat gut_output.log
            exit 1
          fi
          
          echo "✅ Tests GUT terminés avec succès : $PASSED tests passés"          

  all-tests-passed:
    name: ✅ Tous les tests réussis
    runs-on: ubuntu-latest
    needs: [test-python, test-godot]

    steps:
      - name: All tests passed
        run: echo "✅ Tous les tests sont passés avec succès !"

