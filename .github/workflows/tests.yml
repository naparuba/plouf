name: Tests

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

env:
  GODOT_VERSION: 4.5.1

jobs:
  test-python:
    name: Tests Python
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python 3.13
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'

      - name: Run Python tests
        run: |
          cd tests
          python test_python_parser.py

  test-godot:
    name: Tests Godot (GUT)
    runs-on: ubuntu-latest

    container:
      image: barichello/godot-ci:4.5.1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Godot templates
        run: |
          mkdir -v -p ~/.local/share/godot/export_templates/
          mv /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable || true

      - name: Run GUT tests
        run: |
          godot --headless -s addons/gut/gut_cmdln.gd -gdir=res://tests/ -gexit

      - name: Check test results
        run: |
          echo "Tests Godot terminés"

  all-tests-passed:
    name: ✅ Tous les tests réussis
    runs-on: ubuntu-latest
    needs: [test-python, test-godot]

    steps:
      - name: All tests passed
        run: echo "✅ Tous les tests sont passés avec succès !"

